<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pramuka Indonesia Garuda</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, sans-serif; }
        body { background-color: #042E23; color: #E5E7EB; min-height: 100vh; }
        #screen-welcome { display: flex; flex-direction: column; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; text-align: center; background: radial-gradient(circle, #0A4534 0%, #042E23 100%); }
        .welcome-logo-box { width: 90px; height: 90px; background: rgba(245,158,11,0.1); border: 2px solid #F59E0B; border-radius: 50%; display: flex; align-items: center; justify-content: center; margin-bottom: 20px; }
        .welcome-logo-box svg { width: 50px; height: 50px; fill: #F59E0B; }
        .welcome-title { color: #FFF; font-size: 20px; font-weight: 800; margin-bottom: 4px; }
        .welcome-sub { color: #10B981; font-size: 11px; font-weight: 700; text-transform: uppercase; margin-bottom: 15px; }
        .welcome-slogan { color: #FCD34D; font-style: italic; font-size: 14px; font-weight: 700; margin-bottom: 8px; }
        .welcome-desc { color: #9CA3AF; font-size: 11px; max-width: 320px; margin-bottom: 25px; line-height: 1.4; }
        .btn-enter { background: #D97706; color: #FFF; border: 1px solid #F59E0B; padding: 12px 25px; border-radius: 25px; font-weight: 800; font-size: 13px; cursor: pointer; }

        #screen-main { display: none; flex-direction: column; min-height: 100vh; }
        .topbar { background: #03231B; padding: 12px 16px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid rgba(245,158,11,0.3); position: sticky; top: 0; z-index: 50; }
        .brand { display: flex; align-items: center; gap: 10px; }
        .brand-logo { width: 28px; height: 28px; fill: #F59E0B; }
        .brand-text h1 { color: #FFF; font-size: 13px; font-weight: 800; }
        .brand-text p { color: #10B981; font-size: 8px; text-transform: uppercase; }
        .btn-back { background: rgba(255,255,255,0.1); color: #D1D5DB; border: 1px solid rgba(255,255,255,0.2); padding: 4px 10px; border-radius: 10px; font-size: 11px; cursor: pointer; }

        .nav-wrapper { padding: 10px 16px; overflow-x: auto; white-space: nowrap; }
        .nav-container { background: #03231B; padding: 4px; border-radius: 12px; border: 1px solid rgba(255,255,255,0.1); display: inline-flex; gap: 4px; }
        .nav-btn { background: transparent; color: #9CA3AF; border: none; padding: 6px 12px; border-radius: 8px; font-size: 11px; font-weight: 700; cursor: pointer; }
        .nav-btn.active { background: #D97706; color: #FFF; }

        main { padding: 10px 16px 30px; flex: 1; max-width: 800px; margin: 0 auto; width: 100%; }
        .tab-content { display: none; }
        .content-box { background: #0A4534; border: 1px solid rgba(255,255,255,0.1); border-radius: 14px; padding: 16px; color: #FFF; margin-bottom: 14px; }
        .content-box h2 { font-size: 15px; color: #FCD34D; margin-bottom: 6px; font-weight: 800; }
        .content-box p { font-size: 11px; color: #D1D5DB; line-height: 1.5; }

        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 10px; margin-top: 10px; }
        .card { background: #042E23; border: 1px solid rgba(245,158,11,0.2); border-radius: 10px; padding: 12px; text-align: left; }
        .card h3 { color: #FBBF24; font-size: 12px; font-weight: 700; margin-bottom: 4px; }
        .card p { color: #9CA3AF; font-size: 10px; line-height: 1.3; }

        .badge { display: inline-block; padding: 2px 6px; font-size: 8px; font-weight: 800; border-radius: 4px; margin-bottom: 4px; text-transform: uppercase; background: #FEF08A; color: #854D0E; }
        .btn-link { background: none; border: none; color: #FBBF24; font-weight: 700; font-size: 10px; margin-top: 8px; cursor: pointer; padding: 0; }

        .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); z-index: 9999; align-items: center; justify-content: center; padding: 15px; }
        .modal-box { background: #0A4534; border: 2px solid #F59E0B; border-radius: 14px; padding: 16px; max-width: 360px; width: 100%; color: #FFF; }
        .modal-box h3 { color: #FCD34D; font-size: 14px; font-weight: 800; margin-bottom: 6px; }
        .modal-box p { font-size: 11px; color: #D1D5DB; line-height: 1.4; margin-bottom: 12px; }
        .btn-close { background: #D97706; color: #FFF; border: none; width: 100%; padding: 8px; border-radius: 6px; font-weight: 700; cursor: pointer; }

        label { font-size: 10px; font-weight: 700; color: #FCD34D; display: block; margin-bottom: 3px; }
        input, textarea { width: 100%; padding: 8px; background: #042E23; border: 1px solid rgba(255,255,255,0.15); border-radius: 6px; margin-bottom: 10px; color: #FFF; font-size: 11px; }
        .btn-submit { background: #D97706; color: #FFF; border: none; width: 100%; padding: 10px; border-radius: 6px; font-weight: 700; cursor: pointer; }
    </style>
</head>
<body>

    <!-- LAYAR 1 -->
    <div id="screen-welcome">
        <div class="welcome-logo-box">
            <svg viewBox="0 0 100 120"><path d="M50 5 C30 25 35 55 50 115 C65 55 70 25 50 5 Z"/></svg>
        </div>
        <h1 class="welcome-title">Pramuka Indonesia Garuda</h1>
        <p class="welcome-sub">PORTAL DIGITAL KEPANDUAN</p>
        <p class="welcome-slogan">"Satyaku kudarmakan Dharmaku kubaktikan"</p>
        <p class="welcome-desc">Aplikasi interaktif materi kepramukaan dan panduan kecakapan.</p>
        <button class="btn-enter" onclick="masukAplikasi()">Masuk Aplikasi</button>
    </div>

    <!-- LAYAR 2 -->
    <div id="screen-main">
        <div class="topbar">
            <div class="brand">
                <svg class="brand-logo" viewBox="0 0 100 120"><path d="M50 5 C30 25 35 55 50 115 C65 55 70 25 50 5 Z"/></svg>
                <div class="brand-text">
                    <h1>Pramuka Garuda</h1>
                    <p>PORTAL KEPANDUAN</p>
                </div>
            </div>
            <button class="btn-back" onclick="kembaliAwal()">🏠 Awal</button>
        </div>

        <div class="nav-wrapper">
            <div class="nav-container">
                <button id="btn-beranda" class="nav-btn active" onclick="pindahTab('beranda')">🏠 Beranda</button>
                <button id="btn-satuan" class="nav-btn" onclick="pindahTab('satuan')">⚜️ Satuan</button>
                <button id="btn-kegiatan" class="nav-btn" onclick="pindahTab('kegiatan')">🏕️ Kegiatan</button>
                <button id="btn-materi" class="nav-btn" onclick="pindahTab('materi')">📚 Materi</button>
                <button id="btn-kontak" class="nav-btn" onclick="pindahTab('kontak')">📞 Kontak</button>
            </div>
        </div>

        <main>
            <!-- BERANDA -->
            <div id="tab-beranda" class="tab-content" style="display: block;">
                <div class="content-box">
                    <h2>🏠 Beranda Utama</h2>
                    <div class="grid" id="grid-beranda"></div>
                </div>
            </div>

            <!-- SATUAN -->
            <div id="tab-satuan" class="tab-content">
                <div class="content-box">
                    <h2>⚜️ Tingkatan Satuan</h2>
                    <div class="grid" id="grid-satuan"></div>
                </div>
            </div>

            <!-- KEGIATAN -->
            <div id="tab-kegiatan" class="tab-content">
                <div class="content-box">
                    <h2>🏕️ Kegiatan Kepramukaan</h2>
                    <div class="grid" id="grid-kegiatan"></div>
                </div>
            </div>

            <!-- MATERI -->
            <div id="tab-materi" class="tab-content">
                <div class="content-box">
                    <h2>📚 Modul Materi</h2>
                    <div class="grid" id="grid-materi"></div>
                </div>
            </div>

            <!-- KONTAK -->
            <div id="tab-kontak" class="tab-content">
                <div class="content-box">
                    <h2>📞 Kontak</h2>
                    <form onsubmit="kirimForm(event)">
                        <label>Nama</label><input type="text" required placeholder="Nama...">
                        <label>Pesan</label><textarea rows="2" required placeholder="Pesan..."></textarea>
                        <button type="submit" class="btn-submit">Kirim</button>
                    </form>
                </div>
            </div>
        </main>
    </div>

    <!-- MODAL -->
    <div id="modalBox" class="modal-overlay">
        <div class="modal-box">
            <h3 id="modalTitle">Judul</h3>
            <p id="modalBody">Deskripsi...</p>
            <button class="btn-close" onclick="tutupModal()">Tutup</button>
        </div>
    </div>

    <!-- SCRIPT -->
    <script>
        window.onload = function() {
            muatDataAdmin();
        };

        function masukAplikasi() {
            var w = document.getElementById('screen-welcome');
            var m = document.getElementById('screen-main');
            if(w) w.style.display = 'none';
            if(m) m.style.display = 'flex';
            pindahTab('beranda');
        }

        function kembaliAwal() {
            var w = document.getElementById('screen-welcome');
            var m = document.getElementById('screen-main');
            if(m) m.style.display = 'none';
            if(w) w.style.display = 'flex';
        }

        function pindahTab(nama) {
            var tabs = document.getElementsByClassName('tab-content');
            for(var i=0; i<tabs.length; i++) tabs[i].style.display = 'none';
            var btns = document.getElementsByClassName('nav-btn');
            for(var j=0; j<btns.length; j++) btns[j].className = 'nav-btn';
            
            var target = document.getElementById('tab-' + nama);
            if(target) target.style.display = 'block';
            var btnTarget = document.getElementById('btn-' + nama);
            if(btnTarget) btnTarget.className = 'nav-btn active';
        }

        function bukaModal(judul, isi) {
            document.getElementById('modalTitle').innerText = judul;
            document.getElementById('modalBody').innerText = isi;
            document.getElementById('modalBox').style.display = 'flex';
        }

        function tutupModal() {
            document.getElementById('modalBox').style.display = 'none';
        }

        function kirimForm(e) {
            e.preventDefault();
            alert('Pesan terkirim!');
            e.target.reset();
        }

        function muatDataAdmin() {
            try {
                var cBeranda = document.getElementById('grid-beranda');
                var cSatuan = document.getElementById('grid-satuan');
                var cKegiatan = document.getElementById('grid-kegiatan');
                var cMateri = document.getElementById('grid-materi');
                var data = JSON.parse(localStorage.getItem('pramuka_custom_data')) || [];
                
                if(Array.isArray(data)) {
                    data.forEach(function(item) {
                        if(!item || !item.judul || !item.kategori) return;
                        var c = document.createElement('div');
                        c.className = 'card';
                        
                        if(item.kategori === 'beranda' && cBeranda) {
                            c.innerHTML = `<h3>${item.judul}</h3><p>${item.deskripsi || ''}</p>`;
                            cBeranda.appendChild(c);
                        } else if(item.kategori === 'satuan' && cSatuan) {
                            c.innerHTML = `<span class="badge">Satuan</span><h3>${item.judul}</h3><p>${item.deskripsi || ''}</p>`;
                            cSatuan.appendChild(c);
                        } else if(item.kategori === 'kegiatan' && cKegiatan) {
                            c.innerHTML = `<h3>${item.judul}</h3><p>${item.deskripsi || ''}</p>`;
                            cKegiatan.appendChild(c);
                        } else if(item.kategori === 'materi' && cMateri) {
                            c.innerHTML = `<h3>${item.judul}</h3><p>${item.deskripsi || ''}</p>`;
                            var b = document.createElement('button');
                            b.className = 'btn-link';
                            b.innerHTML = 'Pelajari &rarr;';
                            b.onclick = function() { bukaModal(item.judul, item.deskripsi); };
                            c.appendChild(b);
                            cMateri.appendChild(c);
                        }
                    });
                }
            } catch(err) {
                console.log(err);
            }
        }
    </script>
</body>
</html>
