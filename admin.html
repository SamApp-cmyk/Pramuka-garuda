<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel - Pramuka Garuda</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, sans-serif; }
        body { background: #021B14; color: #E5E7EB; min-height: 100vh; padding: 16px; }
        .container { max-width: 600px; margin: 0 auto; }
        
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; border-bottom: 1px solid rgba(245,158,11,0.3); padding-bottom: 12px; }
        .header h1 { color: #FCD34D; font-size: 16px; font-weight: 800; }
        .btn-home { background: rgba(255,255,255,0.1); color: #FFF; border: 1px solid rgba(255,255,255,0.2); padding: 5px 12px; border-radius: 8px; font-size: 11px; font-weight: 700; text-decoration: none; }

        .panel-box { background: #0A4534; border: 1px solid rgba(245,158,11,0.3); border-radius: 14px; padding: 16px; margin-bottom: 16px; }
        .panel-box h2 { font-size: 14px; color: #FCD34D; margin-bottom: 10px; font-weight: 800; }

        label { font-size: 10px; font-weight: 700; color: #FCD34D; display: block; margin-bottom: 3px; }
        input, textarea, select { width: 100%; padding: 8px; background: #042E23; border: 1px solid rgba(255,255,255,0.15); border-radius: 6px; margin-bottom: 10px; color: #FFF; font-size: 11px; outline: none; }
        .btn-submit { background: #D97706; color: #FFF; border: none; width: 100%; padding: 10px; border-radius: 6px; font-weight: 700; cursor: pointer; }
        
        .grid { display: grid; grid-template-columns: 1fr; gap: 8px; margin-top: 8px; }
        .card { background: #042E23; border: 1px solid rgba(245,158,11,0.2); border-radius: 8px; padding: 10px; position: relative; }
        .card h3 { color: #FBBF24; font-size: 11px; font-weight: 700; margin-bottom: 2px; }
        .card p { color: #9CA3AF; font-size: 10px; line-height: 1.3; margin-bottom: 6px; }
        .badge { display: inline-block; padding: 2px 5px; font-size: 8px; font-weight: 800; border-radius: 4px; margin-bottom: 4px; text-transform: uppercase; background: #FEF08A; color: #854D0E; }
        .btn-delete { background: #991B1B; color: #FFF; border: none; padding: 3px 8px; border-radius: 5px; font-size: 9px; font-weight: 700; cursor: pointer; }
    </style>
</head>
<body>

    <div class="container">
        <div class="header">
            <h1>⚙️ Admin Dashboard Konten</h1>
            <a href="index.html" class="btn-home">🌐 Buka Aplikasi Utama</a>
        </div>

        <!-- FORM TAMBAH KONTEN -->
        <div class="panel-box">
            <h2>➕ Tambah Konten Berdasarkan Halaman</h2>
            <form onsubmit="tambahData(event)">
                <label>Pilih Target Halaman (Kategori)</label>
                <select id="adminKategori">
                    <option value="beranda">🏠 Beranda Utama</option>
                    <option value="satuan">⚜️ Tingkatan Satuan</option>
                    <option value="kegiatan">🏕️ Kegiatan Kepramukaan</option>
                    <option value="materi">📚 Modul Materi</option>
                </select>

                <label>Judul / Nama Item</label>
                <input type="text" id="adminJudul" required placeholder="Contoh: Pengumuman Penting / Materi Baru...">

                <label>Deskripsi / Penjelasan Lengkap</label>
                <textarea id="adminDeskripsi" rows="3" required placeholder="Tuliskan isi atau penjelasan di sini..."></textarea>

                <button type="submit" class="btn-submit">💾 Simpan ke Aplikasi</button>
            </form>
        </div>

        <!-- DAFTAR KONTEN TAMBAHAN -->
        <div class="panel-box">
            <h2>📋 Kelola Konten Tambahan</h2>
            <div id="adminDaftarList" class="grid"></div>
        </div>
    </div>

    <script>
        window.onload = function() {
            tampilDaftar();
        };

        function tambahData(e) {
            e.preventDefault();
            var kategori = document.getElementById('adminKategori').value;
            var judul = document.getElementById('adminJudul').value;
            var deskripsi = document.getElementById('adminDeskripsi').value;

            var itemBaru = { kategori: kategori, judul: judul, deskripsi: deskripsi };
            
            var data = JSON.parse(localStorage.getItem('pramuka_custom_data')) || [];
            data.push(itemBaru);
            localStorage.setItem('pramuka_custom_data', JSON.stringify(data));

            alert('Sukses! Konten baru berhasil disimpan dan aktif di halaman terkait.');
            e.target.reset();
            tampilDaftar();
        }

        function tampilDaftar() {
            var container = document.getElementById('adminDaftarList');
            if(!container) return;
            container.innerHTML = '';
            var data = JSON.parse(localStorage.getItem('pramuka_custom_data')) || [];

            if (data.length === 0) {
                container.innerHTML = '<p style="font-size:10px; color:#9CA3AF; text-align:center; padding:8px;">Belum ada konten tambahan.</p>';
                return;
            }

            data.forEach(function(item, index) {
                var card = document.createElement('div');
                card.className = 'card';
                card.innerHTML = `
                    <span class="badge">${item.kategori.toUpperCase()}</span>
                    <h3>${item.judul}</h3>
                    <p>${item.deskripsi}</p>
                    <button class="btn-delete" onclick="hapusData(${index})">🗑️ Hapus</button>
                `;
                container.appendChild(card);
            });
        }

        function hapusData(index) {
            var data = JSON.parse(localStorage.getItem('pramuka_custom_data')) || [];
            data.splice(index, 1);
            localStorage.setItem('pramuka_custom_data', JSON.stringify(data));
            tampilDaftar();
        }
    </script>
</body>
</html>
